name: image-ocr cross-platform CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Pillow (preprocess.py)
        run: python -m pip install --disable-pip-version-check --no-input -q Pillow

      - name: preprocess CLI smoke（生成小图并处理）
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=Path('examples')
          p.mkdir(exist_ok=True)
          Image.new('L',(40,40),255).save(p/'ci-smoke.png')
          PY
          python scripts/preprocess.py examples/ci-smoke.png examples/ci-smoke-out.png --binarize

      - name: Windows 中文 JSON 输出验证
        if: runner.os == 'Windows'
        shell: bash
        run: python scripts/smoke_utf8_json.py
      - name: i18n 英文 smoke（--lang en JSON 可读）
        run: python scripts/smoke_utf8_json.py --lang en
